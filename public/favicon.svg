<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .line { fill: none; stroke: #111; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .solid { fill: #111; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #f2f2ee; }
      .solid { fill: #f2f2ee; }
    }
  </style>
  <defs>
    <!-- Cuts a gap out of the page outline around the padlock, so the padlock reads as in front of it. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="12.5" y="10.5" width="19" height="21" rx="4" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(-1.5 0)">
  <!-- Document: folded top-right corner -->
  <path class="line" mask="url(#gap)" d="M6 3h11l6 6v18H6zM17 3v6h6"/>
  <!-- Padlock: body with a keyhole, and the shackle -->
  <path class="solid" fill-rule="evenodd" d="M17.2 19h9.6a2.2 2.2 0 0 1 2.2 2.2v6.6a2.2 2.2 0 0 1-2.2 2.2h-9.6a2.2 2.2 0 0 1-2.2-2.2v-6.6a2.2 2.2 0 0 1 2.2-2.2zM22 22.7a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3z"/>
  <path class="line" d="M18.5 19v-2.5a3.5 3.5 0 0 1 7 0V19"/>
  </g>
</svg>
